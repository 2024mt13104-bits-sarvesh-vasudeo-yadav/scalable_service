services:
  order-service:
    build: ./services/order-service
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - DB_PATH=/data/orders.db
      - PAYMENT_URL=http://payment-service:8003
      - INVENTORY_URL=http://inventory-service:8001
      - NOTIFICATION_URL=http://notification-service:8002
      - LOG_LEVEL=INFO
    volumes:
      - order_data:/data
    networks:
      - shopflow-net

  inventory-service:
    build: ./services/inventory-service
    ports:
      - "8001:8001"
    environment:
      - PORT=8001
      - DB_PATH=/data/inventory.db
      - LOG_LEVEL=INFO
    volumes:
      - inventory_data:/data
    networks:
      - shopflow-net

  notification-service:
    build: ./services/notification-service
    ports:
      - "8002:8002"
    environment:
      - PORT=8002
      - DB_PATH=/data/notification.db
      - LOG_LEVEL=INFO
    volumes:
      - notification_data:/data
    networks:
      - shopflow-net

  payment-service:
    build: ./services/payment-service
    ports:
      - "8003:8003"
    environment:
      - PORT=8003
      - DB_PATH=/data/payment.db
      - LOG_LEVEL=info
    volumes:
      - payment_data:/data
    networks:
      - shopflow-net

volumes:
  order_data:
  inventory_data:
  notification_data:
  payment_data:

networks:
  shopflow-net:
    driver: bridge
